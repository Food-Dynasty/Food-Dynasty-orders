<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Food Dynasty Orders</title>
  <!-- Staff-only tool: keep it out of Google -->
  <meta name="robots" content="noindex, nofollow">
  <!-- "Add to Home Screen" support: name, icon and colors for the installed app -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FD Orders">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css?v=20261116i">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js" defer></script>
  <script src="js/config.js?v=20261116i" defer></script>
  <script src="js/icons.js?v=20261116i" defer></script>
  <script src="js/catering-menu.js?v=20261116i" defer></script>
  <script src="js/store.js?v=20261116i" defer></script>
  <script src="js/website.js?v=20261116i" defer></script>
  <script src="js/app.js?v=20261116i" defer></script>
</head>

<body>

  <header class="app-header">
    <a class="app-title" href="#/orders">
      <img class="app-logo" src="images/logo.png" alt=""> Orders
    </a>
    <div class="app-header-right">
      <span class="who" id="who"></span>
      <button type="button" class="link-btn" id="sign-out" hidden>Sign out</button>
    </div>
  </header>

  <div class="alert-banner" id="alert-banner" role="alert" hidden>
    <a id="alert-link" href="#/orders/online"><span data-icon="bell"></span> <span id="alert-text"></span> <strong>Open ›</strong></a>
    <button type="button" id="alert-close" aria-label="Dismiss alert">✕</button>
  </div>

  <div class="demo-banner" id="demo-banner" hidden>
    <strong>DEMO MODE:</strong> orders are saved on this device only.
  </div>

  <!-- Every screen is drawn in here by js/app.js -->
  <main class="view" id="view" tabindex="-1">
    <p class="loading">Loading…</p>
    <noscript><p>This app needs JavaScript turned on.</p></noscript>
  </main>

  <!-- Bottom tab bar -->
  <nav class="tabbar" id="tabbar" aria-label="App sections">
    <!-- The red bubble counts website orders waiting to be confirmed -->
    <!-- Icons are filled in by js/icons.js -->
    <a href="#/orders" data-tab="orders"><span data-icon="orders"></span>Orders<b class="tab-badge" id="online-badge" hidden>0</b></a>
    <a href="#/new" data-tab="new" class="tab-new"><span data-icon="plus"></span>New order</a>
    <a href="#/customers" data-tab="customers"><span data-icon="users"></span>Customers</a>
    <a href="#/website" data-tab="website"><span data-icon="globe"></span>Website</a>
  </nav>

  <!-- Small pop-up message ("Order saved") -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

</body>
</html>
